services:
  # ── Qdrant Vector Database ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentic-crag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Redis Cache ──
  redis:
    image: redis:7-alpine
    container_name: agentic-crag-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ── FastAPI Application ──
  app:
    build: .
    container_name: agentic-crag-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./eval:/app/eval
      - ./tests:/app/tests
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
